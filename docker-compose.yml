services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lda_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lda_password}
      POSTGRES_DB: ${POSTGRES_DB:-lda_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lda_user} -d ${POSTGRES_DB:-lda_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lda-network

  redis:
    image: redis:7-alpine
    container_name: lda-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lda-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lda-backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-lda_user}:${POSTGRES_PASSWORD:-lda_password}@postgres:5432/${POSTGRES_DB:-lda_db}
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lda-network

volumes:
  pgdata:
  redisdata:

networks:
  lda-network:
    driver: bridge

